# Campus Köthen — dependency updates
#
# Weekly and deliberately small: a handful of reviewable pull requests beats a
# flood nobody reads. Security updates are not subject to the open-PR cap.

version: 2

updates:
  # --- npm / pnpm workspace ------------------------------------------------
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    versioning-strategy: increase
    labels: ['dependencies', 'javascript']
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
    groups:
      # One PR per ecosystem keeps the review surface small and the lockfile
      # churn coherent.
      nestjs:
        patterns: ['@nestjs/*']
      prisma:
        patterns: ['prisma', '@prisma/*']
      strapi:
        patterns: ['@strapi/*']
      dev-tooling:
        patterns:
          ['eslint*', '@eslint/*', 'typescript-eslint', 'prettier', 'jest', 'ts-jest', '@types/*']
        dependency-type: development
    ignore:
      # Strapi majors carry breaking content-type and plugin changes; they are
      # planned migrations, not routine dependency bumps.
      - dependency-name: '@strapi/*'
        update-types: ['version-update:semver-major']
      # Node types must stay on the runtime major that is actually deployed.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  # --- GitHub Actions ------------------------------------------------------
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    labels: ['dependencies', 'github-actions']
    commit-message:
      prefix: 'chore(ci)'
    groups:
      docker-actions:
        patterns: ['docker/*']

  # --- Container base images ----------------------------------------------
  - package-ecosystem: docker
    directories:
      - /apps/backend
      - /apps/cms
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
    labels: ['dependencies', 'docker']
    commit-message:
      prefix: 'chore(docker)'
    ignore:
      # The Node major is pinned to what Strapi officially supports; moving it
      # is a deliberate decision, not an automated bump.
      - dependency-name: 'node'
        update-types: ['version-update:semver-major']
