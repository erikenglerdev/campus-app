# Campus Köthen — DEV deployment contract for myaioffice.de
#
# ⚠️  THIS FILE IS DOCUMENTATION, NOT AN ACTION.
#     Nothing in this repository deploys it. Applying it is a deliberate,
#     manual step performed by a human on the server.
#
# Target:      myaioffice.de, Linux x86_64
# Directory:   /home/nexa/docker/campus-koethen-dev
# Proxy:       cms-dev.myaioffice.de -> 127.0.0.1:3020
#              api-dev.myaioffice.de -> 127.0.0.1:3021
#              (Both answer 502 until these containers run. That is expected.)
#
# PostgreSQL 16 already runs on the server with the databases and roles
# campus_cms_dev / campus_cms and campus_app_dev / campus_app. This stack does
# NOT start its own database and never publishes one.
#
# Images come from GHCR and are pinned by IMMUTABLE tag. Deploy by digest or by
# the sha- tag; `main` and `dev` move and must not be used for a rollout you
# want to be able to reproduce or roll back.
#
# Usage on the server (manual):
#   cd /home/nexa/docker/campus-koethen-dev
#   cp .env.example .env && $EDITOR .env          # fill in real values
#   docker compose pull
#   docker compose run --rm migrate               # apply database migrations
#   docker compose up -d
#   docker compose ps

name: campus-koethen-dev

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

x-backend-image:
  &backend-image # Pin to an immutable tag, e.g. sha-<full commit sha>. Never `latest`.
  image: ghcr.io/erikenglerdev/campus-app-backend:${BACKEND_IMAGE_TAG:?set BACKEND_IMAGE_TAG to an immutable sha- tag}

services:
  cms:
    image: ghcr.io/erikenglerdev/campus-app-cms:${CMS_IMAGE_TAG:?set CMS_IMAGE_TAG to an immutable sha- tag}
    restart: unless-stopped
    logging: *default-logging
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 1337
      PUBLIC_URL: https://cms-dev.myaioffice.de
      DATABASE_CLIENT: postgres
      DATABASE_HOST: ${DB_HOST:?required}
      DATABASE_PORT: ${DB_PORT:-5432}
      DATABASE_NAME: campus_cms_dev
      DATABASE_USERNAME: campus_cms
      DATABASE_PASSWORD: ${CMS_DB_PASSWORD:?required}
      DATABASE_SSL: ${DB_SSL:-false}
      APP_KEYS: ${APP_KEYS:?required}
      API_TOKEN_SALT: ${API_TOKEN_SALT:?required}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:?required}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT:?required}
      JWT_SECRET: ${JWT_SECRET:?required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?required}
      # Demo seeding stays OFF on a shared instance.
      SEED_DEMO_CONTENT: 'false'
    ports:
      # Loopback only. TLS termination is the existing reverse proxy's job.
      - '127.0.0.1:3020:1337'
    volumes:
      # Named volume for uploads. NO source-code or node_modules bind mounts:
      # the image is the artefact, and mounting over it would defeat the point.
      - cms-uploads:/opt/app/public/uploads
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:1337/_health').then(r=>process.exit(r.status<400?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # One-off migration task. Run it BEFORE `up -d` after deploying a new tag.
  # `migrate deploy` only applies committed migrations and never needs a shadow
  # database, so the campus_app role stays without CREATEDB.
  migrate:
    <<: *backend-image
    restart: 'no'
    profiles: ['migrate']
    logging: *default-logging
    command: ['node_modules/.bin/prisma', 'migrate', 'deploy']
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://campus_app:${APP_DB_PASSWORD:?required}@${DB_HOST:?required}:${DB_PORT:-5432}/campus_app_dev?schema=public

  api:
    <<: *backend-image
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      cms:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://campus_app:${APP_DB_PASSWORD:?required}@${DB_HOST:?required}:${DB_PORT:-5432}/campus_app_dev?schema=public
      # Reached over the internal compose network, not through the proxy.
      STRAPI_BASE_URL: http://cms:1337
      STRAPI_API_TOKEN: ${STRAPI_API_TOKEN:?required}
      # Explicit allowlist. A wildcard is rejected when NODE_ENV=production.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?required}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - '127.0.0.1:3021:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    # Same image as the API, different command.
    <<: *backend-image
    restart: unless-stopped
    logging: *default-logging
    command: ['node', 'dist/worker.js']
    # Serves no HTTP, so the image's liveness probe does not apply.
    healthcheck:
      disable: true
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://campus_app:${APP_DB_PASSWORD:?required}@${DB_HOST:?required}:${DB_PORT:-5432}/campus_app_dev?schema=public
      CANTEEN_SYNC_CRON: ${CANTEEN_SYNC_CRON:-0 */2 * * *}
      CANTEEN_SYNC_ON_BOOT: 'false'
      LOG_LEVEL: ${LOG_LEVEL:-info}

volumes:
  cms-uploads:
