<!DOCTYPE html>
<!--
  Synthetic stand-in for the HTML login page WebUntis returns instead of JSON
  when the anonymous school context is missing or the session is rejected.
  Hand-written, not captured: it exists only so the adapter can prove it
  classifies "HTML where JSON was promised" as a source error instead of
  trying to parse it.
-->
<html lang="de"><head><meta charset="utf-8"><title>WebUntis Login</title></head>
<body><div id="login"><h1>Anmelden</h1><form><input name="school"><input name="j_username"><input name="j_password" type="password"><button>Login</button></form></div></body></html>
