# Campus Köthen — gitleaks configuration
#
# Extends the upstream default ruleset; this file only records deliberate,
# justified exceptions. Every entry names WHY it is not a secret, so the
# allowlist stays auditable instead of becoming a place to silence findings.

[extend]
useDefault = true

[[rules]]
# Keep the default generic-api-key rule, but teach it about this repository's
# known-safe placeholder vocabulary.
id = "generic-api-key"
description = "Generic API Key"
regex = '''(?i)(?:key|api|token|secret|client|passwd|password|auth|access)(?:[0-9a-z\-_\t .]{0,20})(?:[\s|']|[\s|"]){0,3}(?:=|>|:{1,3}=|\|\||:|<=|=>|:=)(?:'|\"|\s|=|\x60){0,5}([0-9a-z\-_.=]{10,150})(?:['|\"|\n|\r|\s|\x60|;]|$)'''
keywords = ["key", "api", "token", "secret", "client", "passwd", "password", "auth", "access"]

[rules.allowlist]
regexTarget = "match"
regexes = [
  # Placeholders in committed .env.example templates. Real values exist only in
  # git-ignored .env files and on the server.
  '''REPLACE_ME[A-Z_]*''',
  '''(?i)(build-only|ci)[-_]?placeholder[-_0-9a-z]*''',
  '''ci_only_not_a_secret''',
  '''tobemodified''',
  '''toBeModified[0-9]*''',
]

[allowlist]
description = "Paths and historical commits with justified, verified exceptions"

paths = [
  # Lockfiles contain integrity hashes, not credentials.
  '''pnpm-lock\.yaml''',
  '''apps/mobile/pubspec\.lock''',
  # Generated Prisma client: embeds the schema text, no secrets.
  '''apps/backend/src/generated/.*''',
  # This file necessarily contains the patterns it allows.
  '''\.gitleaks\.toml''',
]

# Historical false positive.
#
# Commit b205831 added the NestJS scaffold README verbatim. Line 5 contained the
# framework's own CI badge URL with the literal placeholder
# "?token=abc123def456" — upstream sample text, not a credential of any kind.
#
# The file has since been replaced with a real project README, so the string is
# gone from the working tree. It cannot be removed from history: rewriting
# published history is explicitly out of bounds for this project, and doing so
# to erase a placeholder would be far more disruptive than recording it here.
commits = [
  "b205831",
  "b20583141b757da933a6dc7aca509afaf70a75bb",
]
